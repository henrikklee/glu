[package]
name = "glu-client"
version = "0.1.1"
edition.workspace = true
license = "MIT AND BSD-2-Clause"
publish.workspace = true
repository.workspace = true

[dependencies]
anyhow.workspace = true
apple-codesign.workspace = true
flate2.workspace = true
futures-util.workspace = true
glob.workspace = true
glu-core = { path = "../glu-core" }
memchr.workspace = true
regex.workspace = true
reqwest.workspace = true
semver.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
ring.workspace = true
tar.workspace = true
tempfile.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
url.workspace = true
libc.workspace = true

[features]
# Production policy is the default: `cargo build --release` (default features)
# produces the published client — fixed HTTPS registry origin, no dev override
# env vars, no HTTP/file transports (see config/mod.rs registry_base_url and
# validate_registry_url). Development builds opt in explicitly with
# `cargo build-dev`, which writes to `target/dev-registry`.
# `dev-registry` enables GLU_REGISTRY/GLU_PREFIX/GLU_BASE_URL overrides and
# loopback-HTTP for the local dev registry. It is a capability switch, not a
# debug/release-profile switch — `--release` stays purely an optimization level.
# The published client must never be built with this feature.
default = []
dev-registry = []

[dev-dependencies]
