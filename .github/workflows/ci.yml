name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  rust:
    name: Rust quality gate
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Install workflow and shell linters
        run: brew install actionlint shellcheck

      - name: Validate workflows and release scripts
        run: scripts/lint-release.sh

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.98.0
          components: clippy, rustfmt

      - name: Install pinned license tooling
        run: cargo install cargo-about --version 0.9.2 --locked --features cli

      - name: Check dependency licenses and generated notices
        run: scripts/check-third-party-licenses.sh

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy with warnings denied
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test workspace
        run: cargo test --workspace --locked

      - name: Validate production policy and exact installer artifact
        run: scripts/test-release.sh 0.1.1

      - name: Validate dev build isolation
        run: scripts/test-dev-build-isolation.sh

      - name: Validate upgrade behavior
        run: scripts/test-upgrade.sh

      - name: Validate retry-safe release publication
        run: scripts/test-publish-release.sh
