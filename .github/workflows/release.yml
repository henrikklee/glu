name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Plain semver or v-prefixed tag to build without publishing
        required: true
        default: 0.1.2
        type: string
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  # Every release requirement belongs in this job. The publishing job below
  # cannot run unless this complete gate succeeds.
  build:
    name: "Release gate: validate, package, and attest"
    runs-on: macos-14
    permissions:
      contents: read
      id-token: write
      attestations: write
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      asset: ${{ steps.meta.outputs.asset }}
      archive_sha256: ${{ steps.package.outputs.archive_sha256 }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Install workflow and shell linters
        run: brew install actionlint shellcheck

      - name: Validate workflows and release scripts
        run: scripts/lint-release.sh

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.98.0
          components: clippy, rustfmt

      - name: Install pinned license tooling
        run: cargo install cargo-about --version 0.9.2 --locked --features cli

      - name: Check dependency licenses and generated notices
        run: scripts/check-third-party-licenses.sh

      - name: Resolve release metadata
        id: meta
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [[ "$EVENT_NAME" == "push" ]]; then
            requested="$REF_NAME"
          else
            requested="$INPUT_VERSION"
          fi
          if [[ "$requested" =~ ^v?([0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z][0-9A-Za-z.-]*)?)$ ]]; then
            version="${BASH_REMATCH[1]}"
          else
            echo "Invalid release version: $requested" >&2
            exit 1
          fi
          {
            echo "version=$version"
            echo "tag=v$version"
            echo "asset=glu-aarch64-apple-darwin.tar.gz"
          } >> "$GITHUB_OUTPUT"

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy with warnings denied
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test workspace
        run: cargo test --workspace --locked

      - name: Validate dev build isolation
        run: scripts/test-dev-build-isolation.sh

      - name: Validate upgrade behavior
        run: scripts/test-upgrade.sh

      - name: Validate retry-safe release publication
        run: scripts/test-publish-release.sh

      - name: Package and smoke-test retained release assets
        id: package
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          ASSET: ${{ steps.meta.outputs.asset }}
        run: |
          scripts/test-release.sh "$VERSION" dist
          archive_sha256="$(awk '{print $1}' "dist/$ASSET.sha256")"
          [[ "$archive_sha256" =~ ^[0-9a-f]{64}$ ]]
          echo "archive_sha256=$archive_sha256" >> "$GITHUB_OUTPUT"

      - name: Attest production executable
        if: ${{ !github.event.repository.private }}
        id: attest-binary
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: target/release/glu

      - name: Attest release archive
        if: ${{ !github.event.repository.private }}
        id: attest-archive
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: dist/${{ steps.meta.outputs.asset }}

      - name: Verify generated attestations
        if: ${{ !github.event.repository.private }}
        env:
          GH_TOKEN: ${{ github.token }}
          BINARY_BUNDLE: ${{ steps.attest-binary.outputs.bundle-path }}
          ARCHIVE_BUNDLE: ${{ steps.attest-archive.outputs.bundle-path }}
        run: |
          gh attestation verify target/release/glu \
            --repo "$GITHUB_REPOSITORY" \
            --source-digest "$GITHUB_SHA" \
            --bundle "$BINARY_BUNDLE"
          gh attestation verify "dist/${{ steps.meta.outputs.asset }}" \
            --repo "$GITHUB_REPOSITORY" \
            --source-digest "$GITHUB_SHA" \
            --bundle "$ARCHIVE_BUNDLE"

      - name: Upload dry-run/publish inputs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: glu-release-${{ steps.meta.outputs.version }}
          path: |
            dist/${{ steps.meta.outputs.asset }}
            dist/${{ steps.meta.outputs.asset }}.sha256
            dist/install.sh
          if-no-files-found: error

      - name: Enforce public attestation for tagged releases
        if: ${{ github.event.repository.private }}
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          echo "::notice::Artifact attestation is deferred until the repository is public."
          if [[ "$EVENT_NAME" == "push" ]]; then
            echo "Tagged releases cannot be published from a private repository." >&2
            exit 1
          fi

  # This is the workflow's only publishing path, and `needs: build` keeps it
  # unreachable after any validation, packaging, or attestation failure.
  publish:
    name: Publish immutable-ready draft release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout publication script
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Download attested release assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: glu-release-${{ needs.build.outputs.version }}
          path: dist

      - name: Verify downloaded archive identity
        env:
          ASSET: ${{ needs.build.outputs.asset }}
          ARCHIVE_SHA256: ${{ needs.build.outputs.archive_sha256 }}
        run: echo "$ARCHIVE_SHA256  dist/$ASSET" | sha256sum --check --strict

      - name: Create or resume draft, then publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.build.outputs.tag }}
          VERSION: ${{ needs.build.outputs.version }}
        run: scripts/publish-release.sh "$TAG" "$VERSION" dist
